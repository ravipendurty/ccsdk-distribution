name: Build, Deploy Maven Artifacts & Push Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - newdelhi-ios-mcn

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    permissions:
      contents: write
      packages: write  # Needed for both Maven deploy & GHCR push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # - name: Configure GitHub Packages for Maven
      #   run: |
      #     mkdir -p ~/.m2
      #     echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GITHUB_TOKEN }}</password></server></servers></settings>" > ~/.m2/settings.xml

      - name: Build and Deploy Maven Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -s ${GITHUB_WORKSPACE}/settings.xml --file ${GITHUB_WORKSPACE}/alpine/java11/pom.xml deploy -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/ravipendurty/ccsdk-distribution -DskipTests=true -Pdocker

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker Images to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          IMAGES=(
            onap/ccsdk-alpine-j11-image:1.7-SNAPSHOT-latest
          )
          for IMAGE in "${IMAGES[@]}"; do
            echo "$IMAGE"
            docker tag $IMAGE ghcr.io/$OWNER/$IMAGE
            docker push "ghcr.io/$OWNER/$IMAGE"
          done
